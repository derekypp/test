<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歡迎光臨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 12s ease-in-out infinite;
    }

    .blob-1 {
      width: 400px;
      height: 400px;
      background: #ff6b9d;
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      width: 500px;
      height: 500px;
      background: #4facfe;
      bottom: -150px;
      right: -150px;
      animation-delay: -4s;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      background: #fcb69f;
      top: 50%;
      left: 60%;
      animation-delay: -8s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.95); }
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 640px;
      width: 90%;
      padding: 56px 48px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      animation: fadeInUp 0.9s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .emoji {
      font-size: 56px;
      margin-bottom: 16px;
      display: inline-block;
      animation: wave 2.4s ease-in-out infinite;
      transform-origin: 70% 70%;
    }

    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #fff, #ffe1f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      opacity: 0.92;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 600;
      color: #6a3093;
      background: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    }

    .footer {
      margin-top: 32px;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main class="card">
    <span class="emoji" role="img" aria-label="揮手">👋</span>
    <h1>歡迎光臨</h1>
    <p>很高興見到你!<br>這是一個簡潔、現代的歡迎頁面,祝你有美好的一天。</p>
    <a href="#" class="btn" onclick="event.preventDefault(); alert('歡迎開始你的旅程!');">開始探索</a>
    <div class="footer">© 2026 Welcome Page</div>
  </main>
</body>

</html>
